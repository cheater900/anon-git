[project]
name = "anon-git"
version = "0.1.0"
description = "Anonymizes git commit metadata"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["git-filter-repo>=2.47"]

[project.scripts]
anon-git = "anon_git.cli:main"

[dependency-groups]
dev = ["hypothesis", "pexpect", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anon_git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
