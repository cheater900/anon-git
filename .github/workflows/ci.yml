name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add ~/.local/bin to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Install git-filter-repo
        run: pip install --user git-filter-repo

      - name: Install expect (shell-completion tests)
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.13.1
        run: |
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" -o "$HOME/.local/bin/shfmt"
          chmod +x "$HOME/.local/bin/shfmt"

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"

      - name: just lint
        run: just lint

      - name: just format-check
        run: just format-check

      - name: just test
        run: just test
