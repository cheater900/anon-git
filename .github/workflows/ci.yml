name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    defaults:
      run:
        working-directory: anon-git.sh
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add ~/.local/bin to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Install git-filter-repo
        run: python3 -m pip install --user git-filter-repo

      - name: Install expect (Linux, shell-completion tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install expect (macOS, shell-completion tests)
        if: runner.os == 'macOS'
        run: brew install expect

      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.13.1
        run: |
          # Resolve the release asset for whichever OS/arch this job is
          # running on (macos-latest runners are arm64; ubuntu-latest is
          # amd64), instead of hardcoding a single linux_amd64 binary.
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          case "$arch" in
          x86_64) arch=amd64 ;;
          aarch64 | arm64) arch=arm64 ;;
          esac
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_${os}_${arch}" -o "$HOME/.local/bin/shfmt"
          chmod +x "$HOME/.local/bin/shfmt"

      # Libs under runner.temp: the action's /usr/lib defaults aren't
      # writable on macOS runners.
      - name: Install bats, bats-support, bats-assert, bats-file
        id: setup-bats
        uses: bats-core/bats-action@4.0.0
        with:
          detik-install: false
          support-path: ${{ runner.temp }}/bats-libs/bats-support
          assert-path: ${{ runner.temp }}/bats-libs/bats-assert
          file-path: ${{ runner.temp }}/bats-libs/bats-file

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"

      - name: just lint
        run: just lint

      - name: just format-check
        run: just format-check

      - name: just test
        env:
          BATS_LIB_PATH: ${{ runner.temp }}/bats-libs
        run: just test

  python:
    defaults:
      run:
        working-directory: anon-git.py
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install zsh, fish (Linux, shell-completion tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install fish (macOS, shell-completion tests)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Install just
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"

      - name: Install dependencies
        run: uv sync --locked

      - name: just lint
        run: just lint

      - name: just format-check
        run: just format-check

      - name: just test
        run: just test
